stages:
  - validate
  - deploy

validate_static_site:
  stage: validate
  image: python:3.12-alpine
  script:
    - test -f public/index.html
    - test -f public/data/planner-guidance.json
    - grep -q 'id="planner"' public/index.html
    - |
      for file in public/data/*.json; do
        python3 -m json.tool "$file" > /dev/null
      done
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "main"'

pages:
  stage: deploy
  image: alpine:3.20
  script:
    - test -f public/index.html
  pages: true
  artifacts:
    paths:
      - public
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
